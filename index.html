<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Copito: snowball demo</title>
  <script src="vendor/aframe.min.js"></script>
  <style>
    /* Required CC-BY credit for the snowman model (see ASSETS.md). Only
       visible on the 2D page (not inside the headset view) -- a matching
       in-scene credit line is added with the HUD in a later step so it's
       visible in VR too. */
    #credit {
      position: fixed; bottom: 6px; left: 8px; z-index: 9999;
      font: 11px sans-serif; color: #fff; text-shadow: 0 1px 2px #000;
      opacity: 0.8; max-width: 90vw;
    }
  </style>
</head>
<body>
  <div id="credit">
    "Snowman" by <a href="https://sketchfab.com/alixor22" style="color:inherit">alixor22</a>,
    licensed <a href="http://creativecommons.org/licenses/by/4.0/" style="color:inherit">CC-BY-4.0</a>
  </div>
  <a-scene renderer="antialias: true; colorManagement: true; foveationLevel: 1"
           fog="type: linear; color: #aab0b8; near: 4.5; far: 7.9"
           snowball-thrower>
    <!--
      antialias: smooths jagged edges, cheap enough on Quest 2 at this triangle budget.
      colorManagement: keeps colors consistent between the sRGB textures (sky photo) and
      the flat material colors (Copito), otherwise one of the two looks washed out.
      foveationLevel: 1: renders the edge of the lens view at lower resolution (you can't
      resolve it there anyway), a free performance win on the Quest 2 GPU.
      fog: fades the ground plane to the horizon color before its edge (at 8m, plane is
      16x16) is ever reached, so you never see the flat plane's square boundary. Starts
      past Copito (5m away) so he stays crisp and only the ground fades. a-sky ignores
      fog (see material="fog:false" below), so the photo background stays untouched.
    -->

    <a-assets>
      <img id="sky" src="assets/sky/sky.jpg">
      <img id="groundTex" src="assets/sky/ground.jpg">
      <a-asset-item id="copitoModel" src="assets/models/copito/scene.gltf"></a-asset-item>
    </a-assets>

    <!-- Units: meters. Y is up. Negative Z is in front of you. Rotated so the
         tree line sits behind Copito instead of the sun (avoids glare right
         where the player is aiming). material="fog:false" because A-Frame's
         material component defaults fog to ON for every mesh, including the
         sky sphere -- without this override, the whole photo gets blended
         away to the fog color since the sky sphere is effectively very far
         from the camera. -->
    <a-sky src="#sky" rotation="0 120 0" material="fog: false"></a-sky>

    <!-- Ground is a tile cropped from the sky photo's own foreground snow
         (not a flat color) repeated across the circle, so it carries the
         same texture detail (footprints, snow grain) as the photo instead
         of reading as a flat disc. Fog (below) fades it to the photo's
         horizon tone before its edge is reached, hiding the boundary.
         Circular, not square: fog fades by straight-line distance from the
         camera (radially symmetric), so a circle's edge is equidistant all
         the way around and hides exactly as evenly as the fog math expects,
         where a square's corners would sit farther out than its edges. -->
    <!-- shader:flat (unlit) to match <a-sky>'s own shader -- the standard
         (lit) shader multiplies the texture by the scene lights, which are
         tuned much dimmer than the sun exposure already baked into the
         photo, so the ground rendered darker than the sky and the fogged
         edge (matched to the photo's own color) didn't line up smoothly
         with the lit near-ground. Flat removes that mismatch entirely. -->
    <!-- radius is bigger than where the fog fade finishes (far: 7.9, just
         below) on purpose: that leaves a wide ring that's already 100%
         solid fog color before the actual mesh edge, instead of the mesh
         edge itself being the fade's last pixel. The raw join against the
         sky photo's own ground (which has its own color variation we can't
         perfectly match everywhere) happens far out in that solid margin
         instead of right where you'd notice it. -->
    <a-circle rotation="-90 0 0" radius="9.5" mirror-tile
              material="src: #groundTex; repeat: 6 6; shader: flat"></a-circle>

    <!-- Two simple lights instead of a custom rim-light shader (see plan
         notes): a cool hemisphere for ambient sky/ground bounce, one warm
         directional for the sun. Cheap and enough for the PBR model below. -->
    <a-entity light="type: hemisphere; color: #CFEFFF; groundColor: #9aa5ad; intensity: 0.9"></a-entity>
    <a-entity light="type: directional; color: #FFF1D6; intensity: 0.7" position="2 4 1"></a-entity>

    <a-entity id="copito" copito position="0 0 -5"></a-entity>

    <!-- Step 3: hand controllers for Quest, snowball pool + ballistic throw,
         and a per-source dotted aim arc. meta-touch-controls is the current
         A-Frame 1.7.0 component name for Quest Touch controllers (confirmed
         by grepping vendor/aframe.min.js -- oculus-touch-controls also
         exists as an older alias, same implementation). No laser-controls
         anywhere: see hide-controller-line below for why that alone isn't
         enough to keep the beam off. -->
    <a-entity id="leftHand" meta-touch-controls="hand: left" hide-controller-line
              trajectory-preview="source: hand"></a-entity>
    <a-entity id="rightHand" meta-touch-controls="hand: right" hide-controller-line
              trajectory-preview="source: hand"></a-entity>

    <a-entity camera position="0 1.6 0" look-controls wasd-controls
              trajectory-preview="source: desktop"></a-entity>
  </a-scene>

  <script>
    // ---------------------------------------------------------------------
    // CONFIG: every tunable number in one place. Change these, reload, done.
    // Units: meters, seconds, m/s.
    // ---------------------------------------------------------------------
    var CONFIG = {
      // Snowman placement and size
      snowmanDistance: -5,      // meters in front of the player
      snowmanHeight: 1.6,       // approx total height, for reference when tuning parts
      // The downloaded model's own export has an odd internal transform
      // (off-center pivot, arbitrary scale) baked in by its Sketchfab/FBX
      // export. These two numbers were measured once (its raw bounding box,
      // read via THREE.Box3 in the browser) and solved so the model ends up
      // centered and standing on the ground at CONFIG.snowmanHeight tall.
      copitoScale: 0.6324,
      copitoOffset: '-4.206 0.0574 3.6008',

      // Idle animation (step 2): bob + sway are added on top of
      // copitoOffset as deltas on the model wrapper, not the declarative
      // `animation` component, so later steps (hit-wobble, respawn pop) can
      // drive the same transform without fighting over it. Periods are
      // deliberately different (not a shared multiple) so the motion reads
      // as organic drift rather than a mechanical loop.
      idleBobAmplitude: 0.02,   // meters, vertical
      idleBobPeriod: 2.5,       // seconds per full cycle
      idleSwayAmplitude: 0.035, // radians (~2deg), side-to-side tilt
      idleSwayPeriod: 3.2,      // seconds per full cycle

      // Throwing (step 3)
      throwSpeed: 9,
      throwUpBias: 0.15,
      gravity: 9.8,
      throwCooldown: 0.25,
      // 16 total, 12 of which can be sitting landed on the ground (see
      // maxLandedSnowballs below) -- the 4 extra over that give balls
      // actually in flight somewhere to live even when the ground is full,
      // instead of every single throw once-full fighting the pile for a slot.
      maxSnowballs: 16,
      snowballLifetime: 3,
      snowballRadius: 0.08,
      // "Hit" is a capsule check against Copito's position: within
      // snowballHitRadius horizontally, and between the ground and his full
      // height vertically -- not real collision geometry (step 3's event
      // contract note: the model is one fused mesh, so there are no
      // separate part hitboxes), but covers him head-to-foot (including the
      // hat) rather than only a sphere down at his feet. Generous on
      // purpose so aiming slightly off still reads as a hit.
      snowballHitRadius: 0.5,
      hitHeightMargin: 0.15, // extra headroom above snowmanHeight, for the hat tip
      showTrajectory: true,
      trajectoryDots: 12,
      trajectoryDotInterval: 0.08, // seconds of flight time between dots

      // Landed snowballs (step 4): a miss that reaches the ground packs
      // flat and stays there instead of vanishing, up to this many at once.
      // The pool's existing round-robin reuse (see snowball-thrower.spawn)
      // naturally evicts the oldest landed one once the cap is hit -- no
      // separate timer needed, it just gets thrown again like a fresh ball.
      // Landings close to an existing pile (landedStackRadius) stack
      // vertically on top of it instead of overlapping at ground level.
      maxLandedSnowballs: 12,
      landedStackRadius: 0.12, // how close counts as "the same spot"
      landedSquashY: 0.45,  // scale.y multiplier once packed into the ground
      landedSquashXZ: 1.3,  // scale.x/z multiplier (spreads out as it flattens)
      landedSquashTime: 0.12, // seconds to ease into the squashed shape

      // Hits and explosion (steps 4-5). hitsToExplode is the snowman's
      // "type"/lives, and is only ever 1, 3, 5, or 7 (see CRACK_MASTER_ORDER
      // and getCrackSlotsForLives below for why those specific values and
      // not any integer). One crack appears per hit up to the last one
      // (which explodes instead): type 1 explodes on the first hit with no
      // crack at all, type 3 shows 2 cracks, type 5 shows 4, type 7 shows
      // all 6. Default 3; designed to go up to 7 later for a bigger
      // snowman variant -- that bigger-body variant itself isn't built yet,
      // this just keeps the hit/crack system from hard-coding "exactly 2"
      // so raising this number alone will work.
      hitsToExplode: 3,
      chunkCount: 50,
      chunkSpeedMin: 2,
      chunkSpeedMax: 5,
      respawnDelay: 2.5,
      idleSparkleCount: 120,
      explosionSparkleCount: 250,

      // Hit reactions (step 4). Squash/wobble amplitude ramps linearly
      // across the hits leading up to the explosion (hit 1 at the low end,
      // the second-to-last hit at the high end) instead of a fixed
      // per-hit-index table, so it scales automatically with hitsToExplode.
      // Applied as decaying impulses on top of the idle bob/sway, same
      // pattern as those.
      hitSquashAmplitudeRange: [0.16, 0.34],
      hitWobbleAmplitudeRange: [0.0, 0.26], // wobble ramps in from none to a real shake
      hitImpulseDuration: 0.5,     // seconds for the squash/wobble to decay out
      hitImpulseFrequency: 4,     // Hz, how fast the squash/wobble oscillates while decaying
      hitFlashColor: '#FFFFFF',
      hitFlashDuration: 0.12,      // seconds the material stays flashed
      snowPuffCount: 24,
      snowPuffSpeed: 1.3,
      snowPuffLifetime: 0.45,

      // Crack decals (step 4): per Vincent's reference sketch, every active
      // crack crosses through the same central point on the torso (not
      // spread to different spots) -- see CRACK_MASTER_ORDER/CRACK_SLOTS
      // for the fixed per-slot colors and crossing angles, and
      // getCrackSlotsForLives for which slots a given hitsToExplode shows.
      // crackCenter is in Copito's own el-local meters (same frame as
      // copitoOffset), converted to the model's raw/pre-scale space at
      // build time (see copito.worldToModelLocal) so each decal can be
      // parented inside the model wrapper and inherit every animation
      // (bob/sway/squash/wobble) for free, instead of drifting separately.
      crackCenter: { x: 0, y: 0.82, z: 0.22 },
      crackSize: 0.75, // big enough to read as a real fracture across the torso, not a small nick

      // Hit squash/wobble (step 4) rotate/scale around this point instead
      // of the model wrapper's own raw origin. The wrapper's local origin
      // sits wherever the glTF's messy export transform happens to put it
      // (far from the visible mesh -- see copitoOffset's own comment), so
      // rotating/scaling it directly swings the whole body sideways by a
      // large distance instead of wobbling in place. This pivot is a plain
      // point in el-local meters, roughly mid-body height, with no such
      // baggage -- see the hitPivot setup in copito.init.
      hitPivotHeight: 0.8,

      // Sound volumes 0 to 1 (step 6)
      volume: {
        throw: 0.5,
        hit: 0.6,
        crack: 0.6,
        explosion: 0.8,
        respawn: 0.6,
        ambience: 0.25
      },

      // Haptic pulses: [intensity 0 to 1, duration ms] (step 6)
      haptics: {
        throw: [0.3, 40],
        hit: [0.6, 80],
        explosion: [1.0, 150]
      },

      // Copito's palette, so the whole look can be re-tinted from one place
      colors: {
        snowBase: '#CFF5EA',
        snowLight: '#E2FBF4',
        tealDark: '#0B3D3A',
        tealMid: '#17A2A0',
        teal: '#14B8A6',
        tealStripe: '#0F766E',
        iceNose: '#2EC4B6',
        crownCyan: '#7DF9FF',
        sparkle: '#B8FFF4',
        snowball: '#F4FFFD'
      }
    };

    // ---------------------------------------------------------------------
    // I18N: every piece of visible text, Spanish first (default language).
    // ---------------------------------------------------------------------
    var I18N = {
      es: {
        instructionVR: '¡Apunta y aprieta el gatillo para lanzar bolas de nieve!',
        instructionDesktop: 'Haz clic para lanzar',
        hits: 'Golpes',
        destroyed: 'Muñecos destruidos'
      },
      en: {
        instructionVR: 'Aim and pull the trigger to throw snowballs!',
        instructionDesktop: 'Click to throw',
        hits: 'Hits',
        destroyed: 'Snowmen destroyed'
      }
    };

    // ---------------------------------------------------------------------
    // DesktopAim: live mouse position in normalized device coordinates
    // (-1 to 1), shared by snowball-thrower (desktop throw direction) and
    // trajectory-preview (desktop arc). A plain object with one listener,
    // not a component, since nothing here is tied to a specific entity.
    // ---------------------------------------------------------------------
    var DesktopAim = { x: 0, y: 0 };
    window.addEventListener('mousemove', function (evt) {
      DesktopAim.x = (evt.clientX / window.innerWidth) * 2 - 1;
      DesktopAim.y = -(evt.clientY / window.innerHeight) * 2 + 1;
    });

    // ---------------------------------------------------------------------
    // hide-controller-line: meta-touch-controls (like every vendor
    // touch-controls component) auto-attaches its own raycaster with
    // showLine:true as soon as a controller connects -- confirmed by
    // grepping vendor/aframe.min.js (its internal per-vendor mapping merges
    // `{showLine: true}` as the default), not assumed from memory, per the
    // step 1 lesson. The dotted trajectory arc is the only aim visual this
    // demo wants (it shows the real gravity drop, a straight laser doesn't,
    // and the original spec's own note says to keep hello_quest's laser
    // hidden since it fights with the arc), so this flips the
    // auto-added line back off every time the library turns it on.
    // ---------------------------------------------------------------------
    AFRAME.registerComponent('hide-controller-line', {
      init: function () {
        var hide = () => this.el.setAttribute('raycaster', 'showLine', false);
        this.el.addEventListener('controllerconnected', hide);
        this.el.addEventListener('controllermodelready', hide);
      }
    });

    // ---------------------------------------------------------------------
    // snowball-thrower: lives on <a-scene>. Owns the pooled snowball
    // entities, listens for throw input from both hands and the desktop
    // mouse, and runs the shared ballistic tick for every live snowball.
    // One pool, pre-created once and reused by round-robin index, per the
    // no-create/destroy-per-throw budget.
    // ---------------------------------------------------------------------
    AFRAME.registerComponent('snowball-thrower', {
      init: function () {
        var THREE = AFRAME.THREE;
        this.lastTickTime = 0;
        this.cooldownUntil = {}; // per source key ('left'/'right'/'desktop')
        this.scratchOrigin = new THREE.Vector3();
        this.scratchDir = new THREE.Vector3();
        this.scratchCopitoPos = new THREE.Vector3();
        this.raycaster = new THREE.Raycaster();

        this.buildPool();

        this.leftHand = this.el.querySelector('#leftHand');
        this.rightHand = this.el.querySelector('#rightHand');

        this.leftHand.addEventListener('triggerdown', () => this.throwFromHand(this.leftHand, 'left'));
        this.rightHand.addEventListener('triggerdown', () => this.throwFromHand(this.rightHand, 'right'));

        // this.el.canvas only exists once the scene has finished loading.
        if (this.el.hasLoaded) {
          this.attachDesktopInput();
        } else {
          this.el.addEventListener('loaded', () => this.attachDesktopInput());
        }
      },

      attachDesktopInput: function () {
        this.el.canvas.addEventListener('mousedown', () => this.throwFromDesktop());
      },

      buildPool: function () {
        var THREE = AFRAME.THREE;
        this.pool = [];
        this.nextIndex = 0;
        // FIFO of currently-landed slots, oldest first -- bounded by
        // CONFIG.maxLandedSnowballs (see land()/evictOldestLanded()).
        this.landed = [];
        for (var i = 0; i < CONFIG.maxSnowballs; i++) {
          var el = document.createElement('a-sphere');
          el.setAttribute('radius', CONFIG.snowballRadius);
          el.setAttribute('segments-width', 8);
          el.setAttribute('segments-height', 8);
          el.setAttribute('material', 'color: ' + CONFIG.colors.snowball + '; roughness: 0.6; metalness: 0');
          el.setAttribute('visible', false);
          this.el.appendChild(el);
          // state: 'free' (available to throw) | 'flying' (ballistic, gets
          // physics + hit checks) | 'landed' (static, packed into the
          // ground, just sitting there until its slot is reused).
          this.pool.push({ el: el, state: 'free', velocity: new THREE.Vector3(), spawnTime: 0, landTime: 0 });
        }
      },

      throwFromHand: function (handEl, sourceKey) {
        if (!this.canThrow(sourceKey)) return;
        handEl.object3D.getWorldPosition(this.scratchOrigin);
        handEl.object3D.getWorldDirection(this.scratchDir);
        this.spawn(this.scratchOrigin, this.scratchDir);
        this.pulseHaptics(handEl, CONFIG.haptics.throw[0], CONFIG.haptics.throw[1]);
      },

      throwFromDesktop: function () {
        if (!this.canThrow('desktop')) return;
        var camera = this.el.camera;
        if (!camera) return;
        this.raycaster.setFromCamera({ x: DesktopAim.x, y: DesktopAim.y }, camera);
        this.spawn(this.raycaster.ray.origin, this.raycaster.ray.direction);
      },

      canThrow: function (sourceKey) {
        var now = this.lastTickTime;
        if (this.cooldownUntil[sourceKey] !== undefined && now < this.cooldownUntil[sourceKey]) return false;
        this.cooldownUntil[sourceKey] = now + CONFIG.throwCooldown * 1000;
        return true;
      },

      spawn: function (origin, direction) {
        var sb = this.pool[this.nextIndex];
        this.nextIndex = (this.nextIndex + 1) % this.pool.length;

        // Reusing a slot that's currently sitting packed on the ground --
        // free it (and anything stacked on top of it, see freeLanded) since
        // it's about to fly again.
        if (sb.state === 'landed') this.freeLanded(sb);

        sb.state = 'flying';
        sb.spawnTime = this.lastTickTime;
        sb.el.object3D.position.copy(origin);
        sb.el.object3D.scale.set(1, 1, 1);
        sb.el.object3D.visible = true;

        sb.velocity.copy(direction).normalize().multiplyScalar(CONFIG.throwSpeed);
        sb.velocity.y += CONFIG.throwUpBias;
      },

      deactivate: function (sb) {
        sb.state = 'free';
        sb.el.object3D.visible = false;
      },

      // A miss that reaches the ground packs flat and stays there (reads as
      // snow piling up) instead of vanishing. A landing close to an
      // existing pile (landedStackRadius) stacks vertically on top of it
      // instead of overlapping at ground level. Bounded by
      // maxLandedSnowballs: once full, the oldest landed ball is freed back
      // to the pool so the round-robin in spawn() can reuse its slot
      // immediately.
      land: function (sb) {
        var pos = sb.el.object3D.position;
        var unit = CONFIG.snowballRadius * CONFIG.landedSquashY; // squashed half-height
        var base = this.findStackBase(pos);

        sb.state = 'landed';
        sb.landTime = this.lastTickTime;
        sb.velocity.set(0, 0, 0);

        if (base) {
          var basePos = base.el.object3D.position;
          pos.x = basePos.x;
          pos.z = basePos.z;
          pos.y = basePos.y + unit * 2; // sits directly on top of base's packed height
        } else {
          pos.y = unit;
        }

        this.landed.push(sb);
        if (this.landed.length > CONFIG.maxLandedSnowballs) {
          this.evictForCap();
        }
      },

      // The landed ball (if any) directly under a new impact point, i.e.
      // the current top of whatever pile is already at that spot.
      findStackBase: function (pos) {
        var best = null;
        for (var i = 0; i < this.landed.length; i++) {
          var other = this.landed[i];
          var otherPos = other.el.object3D.position;
          var dx = otherPos.x - pos.x;
          var dz = otherPos.z - pos.z;
          if (dx * dx + dz * dz > CONFIG.landedStackRadius * CONFIG.landedStackRadius) continue;
          if (!best || otherPos.y > best.el.object3D.position.y) best = other;
        }
        return best;
      },

      // True if some other landed ball sits directly on top of sb (i.e. sb
      // is currently buried, not the top of its pile).
      hasSupportAbove: function (sb) {
        var pos = sb.el.object3D.position;
        return this.landed.some((other) => {
          if (other === sb) return false;
          var otherPos = other.el.object3D.position;
          var dx = otherPos.x - pos.x;
          var dz = otherPos.z - pos.z;
          return dx * dx + dz * dz <= CONFIG.landedStackRadius * CONFIG.landedStackRadius &&
            otherPos.y > pos.y;
        });
      },

      // Cap eviction always targets the oldest ball that's currently the
      // TOP of its own pile -- never a buried one. A tall single stack at
      // one spot caps out instead of periodically collapsing wholesale
      // (which freeing a buried base would otherwise do, see freeLanded).
      evictForCap: function () {
        for (var i = 0; i < this.landed.length; i++) {
          if (!this.hasSupportAbove(this.landed[i])) {
            this.freeLanded(this.landed[i]);
            return;
          }
        }
        this.freeLanded(this.landed[0]); // every ball buried somehow -- shouldn't happen, but don't get stuck
      },

      // Frees a landed ball back to the pool. If other landed balls are
      // stacked directly on top of it, they'd be left floating once it's
      // gone -- so they're freed too (the pile topples along with its
      // base), recursively up the stack. Reached from two places: a direct
      // slot steal in spawn() (no choice which ball), and evictForCap's
      // fallback -- evictForCap's normal path only ever targets topmost
      // balls, so this recursion is a no-op there in practice.
      freeLanded: function (sb) {
        var idx = this.landed.indexOf(sb);
        if (idx !== -1) this.landed.splice(idx, 1);

        var pos = sb.el.object3D.position;
        var above = this.landed.filter((other) => {
          var otherPos = other.el.object3D.position;
          var dx = otherPos.x - pos.x;
          var dz = otherPos.z - pos.z;
          return dx * dx + dz * dz <= CONFIG.landedStackRadius * CONFIG.landedStackRadius &&
            otherPos.y > pos.y;
        });
        above.forEach((other) => this.freeLanded(other));

        this.deactivate(sb);
      },

      pulseHaptics: function (handEl, intensity, durationMs) {
        var tracked = handEl.components['tracked-controls'];
        var gamepad = tracked && tracked.controller && tracked.controller.gamepad;
        var actuator = gamepad && gamepad.hapticActuators && gamepad.hapticActuators[0];
        if (actuator) actuator.pulse(intensity, durationMs);
      },

      // Ballistic update for every live snowball (Euler integration, scratch
      // vectors reused, no per-frame allocation) + the proximity "hit"
      // check against every registered snowman (see copitoRegistry) that
      // hands off to step 4 via the `snowball-hit` DOM event on whichever
      // one got hit.
      tick: function (time, delta) {
        this.lastTickTime = time;
        var dt = Math.min(delta / 1000, 0.05);

        for (var i = 0; i < this.pool.length; i++) {
          var sb = this.pool[i];

          if (sb.state === 'landed') {
            // Ease the squash in over landedSquashTime instead of snapping,
            // so it still reads as a soft "pack" rather than a pop.
            var sinceLand = (time - sb.landTime) / 1000;
            var squashT = Math.min(sinceLand / CONFIG.landedSquashTime, 1);
            sb.el.object3D.scale.set(
              1 + (CONFIG.landedSquashXZ - 1) * squashT,
              1 + (CONFIG.landedSquashY - 1) * squashT,
              1 + (CONFIG.landedSquashXZ - 1) * squashT
            );
            continue;
          }

          if (sb.state !== 'flying') continue;

          sb.velocity.y -= CONFIG.gravity * dt;
          sb.el.object3D.position.addScaledVector(sb.velocity, dt);

          var pos = sb.el.object3D.position;
          var hitSnowman = this.findHitSnowman(pos);
          if (hitSnowman) {
            hitSnowman.el.emit('snowball-hit', { point: { x: pos.x, y: pos.y, z: pos.z } });
            this.deactivate(sb);
            continue;
          }

          if (pos.y <= CONFIG.snowballRadius) {
            this.land(sb);
            continue;
          }

          if ((time - sb.spawnTime) / 1000 > CONFIG.snowballLifetime) {
            this.deactivate(sb);
          }
        }
      },

      // Capsule check (horizontal radius + a height range, not a single
      // sphere) against every registered snowman, not just one hardcoded
      // entity -- a sphere centered on a snowman's root (his feet) would
      // miss anything near the head/hat, since that's a full snowmanHeight
      // above the check point. Generous on purpose so aiming slightly off
      // still reads as a hit. Returns the first snowman hit, or null.
      findHitSnowman: function (pos) {
        for (var i = 0; i < copitoRegistry.length; i++) {
          var snowman = copitoRegistry[i];
          snowman.el.object3D.getWorldPosition(this.scratchCopitoPos);
          var dx = pos.x - this.scratchCopitoPos.x;
          var dz = pos.z - this.scratchCopitoPos.z;
          var horizontalDist = Math.sqrt(dx * dx + dz * dz);
          var withinHeight = pos.y >= this.scratchCopitoPos.y &&
            pos.y <= this.scratchCopitoPos.y + CONFIG.snowmanHeight + CONFIG.hitHeightMargin;
          if (horizontalDist <= CONFIG.snowballHitRadius && withinHeight) return snowman;
        }
        return null;
      }
    });

    function lerp(a, b, t) { return a + (b - a) * t; }

    // ---------------------------------------------------------------------
    // copitoRegistry: every live `copito` component instance. Hit detection
    // (snowball-thrower.findHitSnowman) loops this instead of looking up a
    // single hardcoded `#copito` id, so multiple snowmen on the map later
    // is a matter of adding more entities, not touching the throw/hit code.
    // Not built/used for placing multiple snowmen yet -- just the lookup
    // side made generic now, per Vincent's future-proofing request.
    // ---------------------------------------------------------------------
    var copitoRegistry = [];
    var copitoInstanceCounter = 0; // unique id source for per-instance asset ids, see copito.init

    // ---------------------------------------------------------------------
    // CRACK_MASTER_ORDER / CRACK_SLOTS / getCrackSlotsForLives: Vincent's
    // reference sketch -- six possible crack "slots", each a fixed color
    // and fixed crossing angle, all crossing through the same central point
    // on the torso (not spread to different spots). A snowman's type
    // (CONFIG.hitsToExplode: 1, 3, 5, or 7 lives -- no other value makes
    // sense here) determines how many of those six are active, and they're
    // always a SUFFIX of this one master order, not an arbitrary subset:
    // slots 1/2 (red/amber) are always the final pair shown right before
    // death, 3/4 (pink/green) are added before that for type 5+, and 6/7
    // (blue) are added before even those for type 7. So a tougher snowman
    // gets earlier cracks prepended, never new ones appended at the end --
    // "dies right after cracking 1,2" stays true for every type that has
    // them. `angle` is in degrees, used by makeCrackTexture to draw each
    // slot's curve sweeping through the shared center at a different tilt
    // (steepest/most-central for 1/2, widest for 6/7), so several active
    // slots read as one crossing pattern, like the sketch, rather than
    // needing separate plane positions per slot.
    // ---------------------------------------------------------------------
    var CRACK_MASTER_ORDER = [6, 7, 3, 4, 1, 2];
    var CRACK_SLOTS = {
      1: { angle: -20, core: '#A32D2D', glow: '#E24B4A' }, // red
      2: { angle: 20, core: '#854F0B', glow: '#EF9F27' },  // amber
      3: { angle: -45, core: '#72243E', glow: '#D4537E' }, // pink
      4: { angle: 45, core: '#27500A', glow: '#97C459' },  // green
      6: { angle: -70, core: '#0C447C', glow: '#378ADD' }, // blue
      7: { angle: 70, core: '#042C53', glow: '#85B7EB' }   // blue, darker
    };

    function getCrackSlotsForLives(lives) {
      // Snaps to the nearest valid type (1/3/5/7) instead of silently
      // producing a broken partial set (e.g. lives=4 would otherwise cut a
      // pair in half) if CONFIG is ever set to something else by mistake.
      var valid = [1, 3, 5, 7];
      var snapped = valid.reduce((a, b) => Math.abs(b - lives) < Math.abs(a - lives) ? b : a);
      var count = Math.max(0, snapped - 1);
      return CRACK_MASTER_ORDER.slice(CRACK_MASTER_ORDER.length - count);
    }

    // ---------------------------------------------------------------------
    // circleSpriteTexture: a small soft-edged white circle, painted once on
    // a canvas and shared by every trajectory-preview instance. WebGL point
    // sprites render as plain squares unless given a `map` texture (with
    // alphaTest to cut out the corners) -- this is that texture, round
    // instead of square.
    // ---------------------------------------------------------------------
    var circleSpriteTexture = null;
    function getCircleSpriteTexture() {
      if (circleSpriteTexture) return circleSpriteTexture;
      var canvas = document.createElement('canvas');
      canvas.width = canvas.height = 64;
      var ctx = canvas.getContext('2d');
      var gradient = ctx.createRadialGradient(32, 32, 0, 32, 32, 30);
      gradient.addColorStop(0, 'rgba(255,255,255,1)');
      gradient.addColorStop(0.7, 'rgba(255,255,255,0.9)');
      gradient.addColorStop(1, 'rgba(255,255,255,0)');
      ctx.fillStyle = gradient;
      ctx.fillRect(0, 0, 64, 64);
      circleSpriteTexture = new AFRAME.THREE.CanvasTexture(canvas);
      return circleSpriteTexture;
    }

    // ---------------------------------------------------------------------
    // trajectory-preview: one dotted arc per aim source (each hand entity,
    // plus one on the camera for desktop). Dot positions come from the same
    // ballistic formula snowball-thrower uses, so the preview actually
    // matches where a thrown snowball will go. Hidden while that source's
    // trigger/mouse button is held down.
    // ---------------------------------------------------------------------
    AFRAME.registerComponent('trajectory-preview', {
      schema: { source: { default: 'hand' } }, // 'hand' or 'desktop'

      init: function () {
        var THREE = AFRAME.THREE;
        this.held = false;
        this.scratchOrigin = new THREE.Vector3();
        this.scratchDir = new THREE.Vector3();
        this.raycaster = new THREE.Raycaster();

        var n = CONFIG.trajectoryDots;
        var geometry = new THREE.BufferGeometry();
        geometry.setAttribute('position', new THREE.BufferAttribute(new Float32Array(n * 3), 3));

        this.points = new THREE.Points(geometry, new THREE.PointsMaterial({
          color: new THREE.Color(CONFIG.colors.snowball),
          size: 0.055,
          sizeAttenuation: true,
          map: getCircleSpriteTexture(),
          alphaTest: 0.1, // discards the texture's transparent corners instead of just blending them, so depthWrite can stay accurate
          transparent: true,
          opacity: 0.9,
          depthWrite: false
        }));
        // A thin line through the same dots so the arc reads as one curve,
        // not a scatter of separate points. Shares the Points' geometry
        // (same position attribute, one update moves both) rather than
        // duplicating the buffer.
        this.line = new THREE.Line(geometry, new THREE.LineBasicMaterial({
          color: new THREE.Color(CONFIG.colors.snowball),
          transparent: true,
          opacity: 0.35,
          depthWrite: false
        }));
        // World-space points/line: positions below are computed in world
        // space directly, so these attach to the scene root rather than
        // `el`, independent of the aim source's own transform.
        this.el.sceneEl.object3D.add(this.points);
        this.el.sceneEl.object3D.add(this.line);

        if (this.data.source === 'hand') {
          this.el.addEventListener('triggerdown', () => { this.held = true; });
          this.el.addEventListener('triggerup', () => { this.held = false; });
        } else {
          var attach = () => {
            this.el.sceneEl.canvas.addEventListener('mousedown', () => { this.held = true; });
            this.el.sceneEl.canvas.addEventListener('mouseup', () => { this.held = false; });
          };
          if (this.el.sceneEl.hasLoaded) attach();
          else this.el.sceneEl.addEventListener('loaded', attach);
        }
      },

      tick: function () {
        var hideForVR = this.data.source === 'desktop' && this.el.sceneEl.is('vr-mode');
        if (!CONFIG.showTrajectory || this.held || hideForVR) {
          this.setVisible(false);
          return;
        }

        if (this.data.source === 'hand') {
          this.el.object3D.getWorldPosition(this.scratchOrigin);
          this.el.object3D.getWorldDirection(this.scratchDir);
        } else {
          var camera = this.el.sceneEl.camera;
          if (!camera) { this.setVisible(false); return; }
          this.raycaster.setFromCamera({ x: DesktopAim.x, y: DesktopAim.y }, camera);
          this.scratchOrigin.copy(this.raycaster.ray.origin);
          this.scratchDir.copy(this.raycaster.ray.direction);
        }

        this.setVisible(true);
        this.updateDots();
      },

      setVisible: function (visible) {
        this.points.visible = visible;
        this.line.visible = visible;
      },

      updateDots: function () {
        var positions = this.points.geometry.attributes.position.array;
        var vx = this.scratchDir.x * CONFIG.throwSpeed;
        var vy = this.scratchDir.y * CONFIG.throwSpeed + CONFIG.throwUpBias;
        var vz = this.scratchDir.z * CONFIG.throwSpeed;

        for (var i = 0; i < CONFIG.trajectoryDots; i++) {
          var t = (i + 1) * CONFIG.trajectoryDotInterval;
          positions[i * 3] = this.scratchOrigin.x + vx * t;
          positions[i * 3 + 1] = this.scratchOrigin.y + vy * t - 0.5 * CONFIG.gravity * t * t;
          positions[i * 3 + 2] = this.scratchOrigin.z + vz * t;
        }

        this.points.geometry.attributes.position.needsUpdate = true;
      }
    });

    // ---------------------------------------------------------------------
    // mirror-tile: makes a repeated ground texture seamless. A-Frame's
    // `repeat` attribute tiles the texture, but plain repeating shows a
    // visible seam every tile (the crop's edges don't match up). Mirroring
    // every other tile fixes that for free, since a flipped copy of an
    // image always lines up with itself at the seam -- no special texture
    // needed. Not exposed as a plain HTML attribute, so it's a few lines
    // of three.js instead.
    // ---------------------------------------------------------------------
    AFRAME.registerComponent('mirror-tile', {
      init: function () {
        this.el.addEventListener('materialtextureloaded', () => {
          var map = this.el.getObject3D('mesh').material.map;
          map.wrapS = map.wrapT = AFRAME.THREE.MirroredRepeatWrapping;
          map.needsUpdate = true;
        });
      }
    });

    // ---------------------------------------------------------------------
    // copito: builds Copito's look (this step) and will own his idle
    // animation and hit state (next steps).
    //
    // The body is a CC-BY glTF model (see ASSETS.md for the required
    // credit), not hand-built primitives. One consequence worth knowing:
    // it's a single fused mesh (no separate "eye" or "crown" parts to
    // address individually), so later steps implement per-hit reactions
    // (wobble, flash, cracks, etc.) as whole-model transforms and overlay
    // effects instead of animating individual sub-parts.
    // ---------------------------------------------------------------------
    AFRAME.registerComponent('copito', {
      init: function () {
        var el = this.el;

        // Unique per-instance id, used to namespace dynamically-created
        // <img> asset ids (blob shadow, crack textures) below -- with a
        // fixed id, two snowmen would collide on the same DOM id and the
        // second one's textures would silently resolve to the first one's.
        // Not needed with only one snowman today, but several on the map is
        // explicitly planned, so this is cheap to get right now.
        this.instanceId = copitoInstanceCounter++;
        copitoRegistry.push(this);

        // Soft round blob shadow so Copito doesn't look like he's floating.
        // A-Frame has no built-in radial-gradient material, so we paint one
        // on a small canvas once and use it as the plane's texture.
        var shadowImg = this.makeBlobShadowTexture();
        el.sceneEl.querySelector('a-assets').appendChild(shadowImg);
        var shadow = document.createElement('a-plane');
        shadow.setAttribute('rotation', '-90 0 0');
        shadow.setAttribute('position', '0 0.005 0');
        shadow.setAttribute('width', '1.3');
        shadow.setAttribute('height', '1.3');
        shadow.setAttribute('material', 'src: #' + shadowImg.id + '; transparent: true; shader: flat');
        el.appendChild(shadow);

        // hitPivot: a plain, well-centered rotation/scale point for the hit
        // squash + wobble (see CONFIG.hitPivotHeight's comment for why this
        // exists -- the model wrapper's own origin is a bad pivot). Sits
        // directly under `el`, in the same plain el-local meters as
        // everything else positioned there.
        this.hitPivot = document.createElement('a-entity');
        this.hitPivot.setAttribute('position', '0 ' + CONFIG.hitPivotHeight + ' 0');
        el.appendChild(this.hitPivot);

        // The model's own export has a messy internal transform (Sketchfab's
        // auto-converted FBX hierarchy: odd scale, off-center pivot). Rather
        // than fight that, we load it into a wrapper entity and correct it
        // with one scale + one position offset, both tunable from CONFIG.
        // Nested inside hitPivot (not `el` directly) now, with its position
        // adjusted by -hitPivot's own offset so nothing moves at rest (zero
        // squash/wobble) -- see hitPivotHeight's comment.
        this.model = document.createElement('a-entity');
        this.model.setAttribute('gltf-model', '#copitoModel');
        this.model.setAttribute('scale', CONFIG.copitoScale + ' ' + CONFIG.copitoScale + ' ' + CONFIG.copitoScale);
        var offset = CONFIG.copitoOffset.split(' ').map(Number);
        this.model.setAttribute('position', offset[0] + ' ' + (offset[1] - CONFIG.hitPivotHeight) + ' ' + offset[2]);
        this.hitPivot.appendChild(this.model);

        // Two base positions, different frames:
        // - copitoOffsetVec: the original, unshifted el-local offset. Used
        //   by worldToModelLocal to place the crack decals -- that mapping
        //   is unaffected by hitPivot's existence (it nets out to the same
        //   translation chain at rest), so it stays keyed to the original.
        // - modelBasePosition: hitPivot-relative, used below for the idle
        //   bob/sway position-setting each tick (model's parent is now
        //   hitPivot, not `el`, so its base position must be too).
        this.copitoOffsetVec = { x: offset[0], y: offset[1], z: offset[2] };
        this.modelBasePosition = { x: offset[0], y: offset[1] - CONFIG.hitPivotHeight, z: offset[2] };

        this.buildSparkles();

        // Hit reactions (step 4). hitCount drives three escalating stages;
        // see onHit. Materials are collected once the glTF is actually in
        // the scene graph (traversing before model-loaded finds nothing).
        this.hitCount = 0;
        this.lastTime = 0;
        this.materials = null;
        this.flashUntil = undefined;
        this.squashImpulse = { time: -Infinity, amplitude: 0 };
        this.wobbleImpulse = { time: -Infinity, amplitude: 0 };
        this.model.addEventListener('model-loaded', () => this.collectMaterials());
        this.buildSnowPuffs();
        this.buildCrackDecals();
        this.el.addEventListener('snowball-hit', (evt) => this.onHit(evt.detail));
      },

      // copitoOffset/copitoScale correct the glTF's own messy raw-export
      // transform (see the class comment above), which means `this.model`'s
      // local space is that raw, pre-correction space -- not plain meters.
      // Anything parented inside it (the crack decals) needs its authored
      // "nice meters, same frame as copitoOffset" position converted into
      // that raw space once, at build time. After that one conversion, the
      // decal is a rigid child of the model wrapper and inherits every
      // subsequent animation (bob/sway/squash/wobble) automatically through
      // the normal parent-child transform hierarchy -- no per-frame syncing
      // needed, which is what kept the single old crack decal visually
      // detached from the body (it was parented to the non-animated outer
      // entity instead).
      worldToModelLocal: function (v) {
        return {
          x: (v.x - this.copitoOffsetVec.x) / CONFIG.copitoScale,
          y: (v.y - this.copitoOffsetVec.y) / CONFIG.copitoScale,
          z: (v.z - this.copitoOffsetVec.z) / CONFIG.copitoScale
        };
      },

      // Idle bob (vertical sine) + slight sway (side-to-side tilt), applied
      // as deltas on top of the model's corrective offset position. Blink
      // is intentionally skipped: the model is a single fused mesh with no
      // separable eyes (see PROGRESS.md step 2), and the bob/sway/sparkles
      // combo already reads as alive without it.
      tick: function (time) {
        this.lastTime = time;
        var t = time / 1000;
        var bob = Math.sin((t / CONFIG.idleBobPeriod) * Math.PI * 2) * CONFIG.idleBobAmplitude;
        var sway = Math.sin((t / CONFIG.idleSwayPeriod) * Math.PI * 2) * CONFIG.idleSwayAmplitude;

        this.model.object3D.position.set(
          this.modelBasePosition.x,
          this.modelBasePosition.y + bob,
          this.modelBasePosition.z
        );
        this.model.object3D.rotation.z = sway;

        // Hit squash/wobble (step 4): decaying impulses applied on
        // hitPivot, not the model wrapper -- see CONFIG.hitPivotHeight's
        // comment for why (the wrapper's own origin is a bad pivot for
        // rotation/scale; hitPivot is a well-centered stand-in). Deltas on
        // top of its identity rest pose, same pattern as bob/sway above.
        var squash = this.computeImpulse(time, this.squashImpulse);
        var wobble = this.computeImpulse(time, this.wobbleImpulse);
        this.hitPivot.object3D.scale.set(1 + squash * 0.5, 1 - squash, 1 + squash * 0.5);
        this.hitPivot.object3D.rotation.z = wobble;
        this.hitPivot.object3D.rotation.x = wobble * 0.6;

        this.revertFlashIfDone(time);
        this.updateSnowPuffs(time);
        this.updateSparkles(t);
      },

      // A damped, decaying oscillation starting at full amplitude the
      // instant it's triggered (impulse.time) and settling back to 0 by
      // CONFIG.hitImpulseDuration later. Shared by the squash and wobble
      // impulses -- same shape, different amplitude/axis.
      computeImpulse: function (time, impulse) {
        var elapsed = (time - impulse.time) / 1000;
        if (elapsed < 0 || elapsed > CONFIG.hitImpulseDuration || impulse.amplitude === 0) return 0;
        var decay = 1 - elapsed / CONFIG.hitImpulseDuration;
        return impulse.amplitude * decay * -Math.cos(elapsed * CONFIG.hitImpulseFrequency * Math.PI * 2);
      },

      // Escalating reaction per hit: every hit gets squash+flash+puff+one
      // more crack (a new one each time, scaling with hitsToExplode -- see
      // its CONFIG comment), with squash/wobble amplitude ramping up
      // (computeImpulse's lerp below) as the hit count climbs toward the
      // last one. The last hit (hitCount reaches hitsToExplode) hands off
      // to step 5's explosion (not built yet), so for now it just resets
      // clean rather than leaving Copito stuck mid-damage.
      onHit: function (detail) {
        var time = this.lastTime;
        this.hitCount++;

        this.spawnSnowPuff(detail.point);
        this.flashMaterials(time);

        // 0 at hit 1, 1 at the last hit before the explosion -- how far
        // along the escalation this hit is, for the amplitude ramps below.
        var crackStages = Math.max(1, CONFIG.hitsToExplode - 1);
        var progress = Math.min(this.hitCount - 1, crackStages - 1) / Math.max(1, crackStages - 1);

        this.squashImpulse.time = time;
        this.squashImpulse.amplitude = lerp(CONFIG.hitSquashAmplitudeRange[0], CONFIG.hitSquashAmplitudeRange[1], progress);

        if (this.hitCount < CONFIG.hitsToExplode) {
          this.wobbleImpulse.time = time;
          this.wobbleImpulse.amplitude = lerp(CONFIG.hitWobbleAmplitudeRange[0], CONFIG.hitWobbleAmplitudeRange[1], progress);
          var crackIndex = this.hitCount - 1;
          if (this.crackDecals[crackIndex]) this.showCrackDecal(crackIndex);
        }

        if (this.hitCount >= CONFIG.hitsToExplode) {
          this.el.emit('snowman-destroyed', { point: detail.point });
          this.hitCount = 0;
          this.hideCrackDecals();
        }
      },

      collectMaterials: function () {
        var mesh = this.model.getObject3D('mesh');
        if (!mesh) return;
        this.materials = [];
        var seen = {};
        mesh.traverse((node) => {
          if (!node.material) return;
          var mats = Array.isArray(node.material) ? node.material : [node.material];
          mats.forEach((mat) => {
            if (seen[mat.uuid] || !mat.color) return;
            seen[mat.uuid] = true;
            this.materials.push({ material: mat, originalColor: mat.color.clone() });
          });
        });
      },

      flashMaterials: function (time) {
        if (!this.materials) return;
        this.flashUntil = time + CONFIG.hitFlashDuration * 1000;
        this.materials.forEach((m) => m.material.color.set(CONFIG.hitFlashColor));
      },

      revertFlashIfDone: function (time) {
        if (this.flashUntil === undefined || time < this.flashUntil) return;
        this.materials.forEach((m) => m.material.color.copy(m.originalColor));
        this.flashUntil = undefined;
      },

      // One shared THREE.Points burst (not per-hit entities) placed in world
      // space at the impact point, reused every hit -- particles beyond
      // their lifetime just stop being written to visible positions.
      buildSnowPuffs: function () {
        var THREE = AFRAME.THREE;
        var n = CONFIG.snowPuffCount;
        this.puffVelocities = [];
        this.puffSpawnTime = new Float32Array(n);
        this.puffOrigin = new THREE.Vector3();
        for (var i = 0; i < n; i++) this.puffVelocities.push(new THREE.Vector3());

        var geometry = new THREE.BufferGeometry();
        geometry.setAttribute('position', new THREE.BufferAttribute(new Float32Array(n * 3), 3));

        this.snowPuffs = new THREE.Points(geometry, new THREE.PointsMaterial({
          color: new THREE.Color(CONFIG.colors.snowLight),
          size: 0.05,
          sizeAttenuation: true,
          transparent: true,
          opacity: 0.9,
          depthWrite: false
        }));
        this.snowPuffs.visible = false;
        this.el.sceneEl.object3D.add(this.snowPuffs);
      },

      spawnSnowPuff: function (point) {
        var n = CONFIG.snowPuffCount;
        this.puffOrigin.set(point.x, point.y, point.z);
        for (var i = 0; i < n; i++) {
          this.puffVelocities[i].set(
            Math.random() * 2 - 1,
            0.2 + Math.random() * 1.2,
            Math.random() * 2 - 1
          ).normalize().multiplyScalar(CONFIG.snowPuffSpeed * (0.5 + Math.random() * 0.5));
          this.puffSpawnTime[i] = this.lastTime;
        }
        this.snowPuffs.visible = true;
        this.snowPuffs.material.opacity = 0.9;
      },

      updateSnowPuffs: function (time) {
        if (!this.snowPuffs.visible) return;
        var n = CONFIG.snowPuffCount;
        var positions = this.snowPuffs.geometry.attributes.position.array;
        var anyAlive = false;

        for (var i = 0; i < n; i++) {
          var age = (time - this.puffSpawnTime[i]) / 1000;
          if (age > CONFIG.snowPuffLifetime) continue;
          anyAlive = true;
          // Light gravity droop (a fraction of real gravity) so the puff
          // reads as soft snow drifting, not a heavy ballistic snowball.
          positions[i * 3] = this.puffOrigin.x + this.puffVelocities[i].x * age;
          positions[i * 3 + 1] = this.puffOrigin.y + this.puffVelocities[i].y * age - 0.5 * (CONFIG.gravity * 0.3) * age * age;
          positions[i * 3 + 2] = this.puffOrigin.z + this.puffVelocities[i].z * age;
        }

        this.snowPuffs.geometry.attributes.position.needsUpdate = true;
        if (!anyAlive) this.snowPuffs.visible = false;
      },

      // One decal per active slot for this snowman's type
      // (getCrackSlotsForLives(CONFIG.hitsToExplode)), built once hidden
      // and just toggled visible as hitCount climbs / on reset, rather
      // than created and torn down each time. All of them share the same
      // position (CONFIG.crackCenter, nudged a hair apart in z per slot
      // only to avoid z-fighting between coplanar decals) -- per Vincent's
      // reference sketch, every crack crosses through the same central
      // point, with only its drawn angle and color (CRACK_SLOTS) telling
      // them apart, not separate spots on the body. Parented inside
      // `this.model` (not `this.el`) so they move with every body
      // animation -- see worldToModelLocal's comment for why that's what
      // actually keeps them glued to Copito.
      buildCrackDecals: function () {
        this.activeCrackSlots = getCrackSlotsForLives(CONFIG.hitsToExplode);
        this.crackDecals = this.activeCrackSlots.map((slotKey, i) => this.buildCrackDecal(slotKey, i));
      },

      buildCrackDecal: function (slotKey, index) {
        var img = this.makeCrackTexture(slotKey);
        this.el.sceneEl.querySelector('a-assets').appendChild(img);

        var center = CONFIG.crackCenter;
        var localPos = this.worldToModelLocal({
          x: center.x, y: center.y, z: center.z + index * 0.002
        });
        var localSize = CONFIG.crackSize / CONFIG.copitoScale;

        var decal = document.createElement('a-plane');
        decal.setAttribute('width', localSize);
        decal.setAttribute('height', localSize);
        decal.setAttribute('position', localPos.x + ' ' + localPos.y + ' ' + localPos.z);
        decal.setAttribute('material', 'src: #' + img.id + '; transparent: true; shader: flat; side: double; alphaTest: 0.02');
        decal.setAttribute('visible', false);
        this.model.appendChild(decal);
        return decal;
      },

      // A single smooth curved sweep through the shared center (a
      // quadratic bezier, gently bulging to read as wrapping the body's
      // roundness), not the earlier jagged branching fracture -- per
      // Vincent's reference sketch and his confirmation that this curved
      // style read well. A soft glow halo behind it keeps it visible
      // against the pale body; a bright highlight riding alongside gives
      // it a "catching the light" sparkle. Colors and crossing angle come
      // from CRACK_SLOTS[slotKey] -- fixed per slot, not randomized, so
      // the same slot always looks the same regardless of which other
      // slots happen to be active for a given snowman type. The glow is
      // kept fairly tight around the line on purpose: with several slots
      // crossing through the same point (tougher types), a wide halo on
      // each one would bleed together into one undifferentiated blob.
      makeCrackTexture: function (slotKey) {
        var slot = CRACK_SLOTS[slotKey];
        var size = 256;
        var canvas = document.createElement('canvas');
        canvas.width = canvas.height = size;
        var ctx = canvas.getContext('2d');
        var cx = size / 2, cy = size / 2;

        var outerGlow = ctx.createRadialGradient(cx, cy, 0, cx, cy, size * 0.3);
        outerGlow.addColorStop(0, slot.glow + '55');
        outerGlow.addColorStop(0.6, slot.glow + '22');
        outerGlow.addColorStop(1, slot.glow + '00');
        ctx.fillStyle = outerGlow;
        ctx.fillRect(0, 0, size, size);

        var coreGlow = ctx.createRadialGradient(cx, cy, 0, cx, cy, size * 0.13);
        coreGlow.addColorStop(0, slot.glow + 'AA');
        coreGlow.addColorStop(1, slot.glow + '00');
        ctx.fillStyle = coreGlow;
        ctx.fillRect(0, 0, size, size);

        var rad = slot.angle * Math.PI / 180;
        var dx = Math.cos(rad), dy = Math.sin(rad);
        var px = -dy, py = dx; // perpendicular, for the curve's bulge
        var reach = size * 0.42;
        var bulge = size * 0.1;
        var x0 = cx - dx * reach, y0 = cy - dy * reach;
        var x1 = cx + dx * reach, y1 = cy + dy * reach;
        var ctrlX = cx + px * bulge, ctrlY = cy + py * bulge;

        var drawCurve = (color, width, offset) => {
          ctx.strokeStyle = color;
          ctx.lineWidth = width;
          ctx.lineCap = 'round';
          ctx.beginPath();
          ctx.moveTo(x0 + offset, y0 + offset);
          ctx.quadraticCurveTo(ctrlX + offset, ctrlY + offset, x1 + offset, y1 + offset);
          ctx.stroke();
        };
        drawCurve(slot.core, 9, 0);
        drawCurve(slot.glow, 3.5, -1.5);

        var img = document.createElement('img');
        img.id = 'crackDecal' + this.instanceId + '_' + slotKey;
        img.src = canvas.toDataURL();
        return img;
      },

      showCrackDecal: function (index) {
        this.crackDecals[index].setAttribute('visible', true);
      },

      hideCrackDecals: function () {
        this.crackDecals.forEach((d) => d.setAttribute('visible', false));
      },

      // ~120 orbiting points around Copito's body, one THREE.Points buffer
      // (not N entities) to keep the draw-call budget flat. Attached to the
      // outer entity's object3D (ground level under Copito), independent of
      // the model wrapper's bob/sway above.
      buildSparkles: function () {
        var n = CONFIG.idleSparkleCount;
        var THREE = AFRAME.THREE;
        var positions = new Float32Array(n * 3);

        this.sparkleAngles = new Float32Array(n);
        this.sparkleSpeeds = new Float32Array(n);
        this.sparkleRadii = new Float32Array(n);
        this.sparkleHeights = new Float32Array(n);
        this.sparklePhases = new Float32Array(n);

        for (var i = 0; i < n; i++) {
          this.sparkleAngles[i] = Math.random() * Math.PI * 2;
          this.sparkleSpeeds[i] = 0.15 + Math.random() * 0.25;
          this.sparkleRadii[i] = 0.55 + Math.random() * 0.45;
          this.sparkleHeights[i] = 0.15 + Math.random() * 1.3;
          this.sparklePhases[i] = Math.random() * Math.PI * 2;
        }

        var geometry = new THREE.BufferGeometry();
        geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));

        var material = new THREE.PointsMaterial({
          color: new THREE.Color(CONFIG.colors.sparkle),
          size: 0.035,
          sizeAttenuation: true,
          transparent: true,
          opacity: 0.85,
          depthWrite: false,
          blending: THREE.AdditiveBlending
        });

        this.sparkles = new THREE.Points(geometry, material);
        this.el.object3D.add(this.sparkles);
        this.updateSparkles(0);
      },

      updateSparkles: function (t) {
        var n = CONFIG.idleSparkleCount;
        var positions = this.sparkles.geometry.attributes.position.array;

        for (var i = 0; i < n; i++) {
          var angle = this.sparkleAngles[i] + t * this.sparkleSpeeds[i];
          var radius = this.sparkleRadii[i];
          var bobOffset = Math.sin(t * 1.5 + this.sparklePhases[i]) * 0.08;

          positions[i * 3] = Math.cos(angle) * radius;
          positions[i * 3 + 1] = this.sparkleHeights[i] + bobOffset;
          positions[i * 3 + 2] = Math.sin(angle) * radius;
        }

        this.sparkles.geometry.attributes.position.needsUpdate = true;
      },

      // Paints a soft radial gradient (dark center, transparent edge) once
      // and returns it as an <img> ready to drop into <a-assets>.
      makeBlobShadowTexture: function () {
        var canvas = document.createElement('canvas');
        canvas.width = 128;
        canvas.height = 128;
        var ctx = canvas.getContext('2d');
        var gradient = ctx.createRadialGradient(64, 64, 0, 64, 64, 64);
        gradient.addColorStop(0, 'rgba(10,40,40,0.35)');
        gradient.addColorStop(1, 'rgba(10,40,40,0)');
        ctx.fillStyle = gradient;
        ctx.fillRect(0, 0, 128, 128);

        var img = document.createElement('img');
        img.id = 'blobShadow' + this.instanceId;
        img.src = canvas.toDataURL();
        return img;
      },

      remove: function () {
        var idx = copitoRegistry.indexOf(this);
        if (idx !== -1) copitoRegistry.splice(idx, 1);
      }
    });
  </script>
</body>
</html>
