<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Copito: snowball demo</title>
  <script src="vendor/aframe.min.js"></script>
  <style>
    /* Required CC-BY credit for the snowman model (see ASSETS.md). Only
       visible on the 2D page (not inside the headset view) -- a matching
       in-scene credit line is added with the HUD in a later step so it's
       visible in VR too. */
    #credit {
      position: fixed; bottom: 6px; left: 8px; z-index: 9999;
      font: 11px sans-serif; color: #fff; text-shadow: 0 1px 2px #000;
      opacity: 0.8; max-width: 90vw;
    }
  </style>
</head>
<body>
  <div id="credit">
    "Snowman" by <a href="https://sketchfab.com/alixor22" style="color:inherit">alixor22</a>,
    licensed <a href="http://creativecommons.org/licenses/by/4.0/" style="color:inherit">CC-BY-4.0</a>
  </div>
  <a-scene renderer="antialias: true; colorManagement: true; foveationLevel: 1"
           fog="type: linear; color: #aab0b8; near: 4.5; far: 7.9">
    <!--
      antialias: smooths jagged edges, cheap enough on Quest 2 at this triangle budget.
      colorManagement: keeps colors consistent between the sRGB textures (sky photo) and
      the flat material colors (Copito), otherwise one of the two looks washed out.
      foveationLevel: 1: renders the edge of the lens view at lower resolution (you can't
      resolve it there anyway), a free performance win on the Quest 2 GPU.
      fog: fades the ground plane to the horizon color before its edge (at 8m, plane is
      16x16) is ever reached, so you never see the flat plane's square boundary. Starts
      past Copito (5m away) so he stays crisp and only the ground fades. a-sky ignores
      fog (see material="fog:false" below), so the photo background stays untouched.
    -->

    <a-assets>
      <img id="sky" src="assets/sky/sky.jpg">
      <img id="groundTex" src="assets/sky/ground.jpg">
      <a-asset-item id="copitoModel" src="assets/models/copito/scene.gltf"></a-asset-item>
    </a-assets>

    <!-- Units: meters. Y is up. Negative Z is in front of you. Rotated so the
         tree line sits behind Copito instead of the sun (avoids glare right
         where the player is aiming). material="fog:false" because A-Frame's
         material component defaults fog to ON for every mesh, including the
         sky sphere -- without this override, the whole photo gets blended
         away to the fog color since the sky sphere is effectively very far
         from the camera. -->
    <a-sky src="#sky" rotation="0 120 0" material="fog: false"></a-sky>

    <!-- Ground is a tile cropped from the sky photo's own foreground snow
         (not a flat color) repeated across the circle, so it carries the
         same texture detail (footprints, snow grain) as the photo instead
         of reading as a flat disc. Fog (below) fades it to the photo's
         horizon tone before its edge is reached, hiding the boundary.
         Circular, not square: fog fades by straight-line distance from the
         camera (radially symmetric), so a circle's edge is equidistant all
         the way around and hides exactly as evenly as the fog math expects,
         where a square's corners would sit farther out than its edges. -->
    <!-- shader:flat (unlit) to match <a-sky>'s own shader -- the standard
         (lit) shader multiplies the texture by the scene lights, which are
         tuned much dimmer than the sun exposure already baked into the
         photo, so the ground rendered darker than the sky and the fogged
         edge (matched to the photo's own color) didn't line up smoothly
         with the lit near-ground. Flat removes that mismatch entirely. -->
    <!-- radius is bigger than where the fog fade finishes (far: 7.9, just
         below) on purpose: that leaves a wide ring that's already 100%
         solid fog color before the actual mesh edge, instead of the mesh
         edge itself being the fade's last pixel. The raw join against the
         sky photo's own ground (which has its own color variation we can't
         perfectly match everywhere) happens far out in that solid margin
         instead of right where you'd notice it. -->
    <a-circle rotation="-90 0 0" radius="9.5" mirror-tile
              material="src: #groundTex; repeat: 6 6; shader: flat"></a-circle>

    <!-- Two simple lights instead of a custom rim-light shader (see plan
         notes): a cool hemisphere for ambient sky/ground bounce, one warm
         directional for the sun. Cheap and enough for the PBR model below. -->
    <a-entity light="type: hemisphere; color: #CFEFFF; groundColor: #9aa5ad; intensity: 0.9"></a-entity>
    <a-entity light="type: directional; color: #FFF1D6; intensity: 0.7" position="2 4 1"></a-entity>

    <a-entity id="copito" copito position="0 0 -5"></a-entity>

    <a-entity camera position="0 1.6 0" look-controls wasd-controls></a-entity>
  </a-scene>

  <script>
    // ---------------------------------------------------------------------
    // CONFIG: every tunable number in one place. Change these, reload, done.
    // Units: meters, seconds, m/s.
    // ---------------------------------------------------------------------
    var CONFIG = {
      // Snowman placement and size
      snowmanDistance: -5,      // meters in front of the player
      snowmanHeight: 1.6,       // approx total height, for reference when tuning parts
      // The downloaded model's own export has an odd internal transform
      // (off-center pivot, arbitrary scale) baked in by its Sketchfab/FBX
      // export. These two numbers were measured once (its raw bounding box,
      // read via THREE.Box3 in the browser) and solved so the model ends up
      // centered and standing on the ground at CONFIG.snowmanHeight tall.
      copitoScale: 0.6324,
      copitoOffset: '-4.206 0.0574 3.6008',

      // Throwing (step 3)
      throwSpeed: 9,
      throwUpBias: 0.15,
      gravity: 9.8,
      throwCooldown: 0.25,
      maxSnowballs: 12,
      snowballLifetime: 3,
      showTrajectory: true,
      trajectoryDots: 12,

      // Hits and explosion (steps 4-5)
      hitsToExplode: 3,
      chunkCount: 50,
      chunkSpeedMin: 2,
      chunkSpeedMax: 5,
      respawnDelay: 2.5,
      idleSparkleCount: 120,
      explosionSparkleCount: 250,

      // Sound volumes 0 to 1 (step 6)
      volume: {
        throw: 0.5,
        hit: 0.6,
        crack: 0.6,
        explosion: 0.8,
        respawn: 0.6,
        ambience: 0.25
      },

      // Haptic pulses: [intensity 0 to 1, duration ms] (step 6)
      haptics: {
        throw: [0.3, 40],
        hit: [0.6, 80],
        explosion: [1.0, 150]
      },

      // Copito's palette, so the whole look can be re-tinted from one place
      colors: {
        snowBase: '#CFF5EA',
        snowLight: '#E2FBF4',
        tealDark: '#0B3D3A',
        tealMid: '#17A2A0',
        teal: '#14B8A6',
        tealStripe: '#0F766E',
        iceNose: '#2EC4B6',
        crownCyan: '#7DF9FF',
        sparkle: '#B8FFF4'
      }
    };

    // ---------------------------------------------------------------------
    // I18N: every piece of visible text, Spanish first (default language).
    // ---------------------------------------------------------------------
    var I18N = {
      es: {
        instructionVR: '¡Apunta y aprieta el gatillo para lanzar bolas de nieve!',
        instructionDesktop: 'Haz clic para lanzar',
        hits: 'Golpes',
        destroyed: 'Muñecos destruidos'
      },
      en: {
        instructionVR: 'Aim and pull the trigger to throw snowballs!',
        instructionDesktop: 'Click to throw',
        hits: 'Hits',
        destroyed: 'Snowmen destroyed'
      }
    };

    // ---------------------------------------------------------------------
    // mirror-tile: makes a repeated ground texture seamless. A-Frame's
    // `repeat` attribute tiles the texture, but plain repeating shows a
    // visible seam every tile (the crop's edges don't match up). Mirroring
    // every other tile fixes that for free, since a flipped copy of an
    // image always lines up with itself at the seam -- no special texture
    // needed. Not exposed as a plain HTML attribute, so it's a few lines
    // of three.js instead.
    // ---------------------------------------------------------------------
    AFRAME.registerComponent('mirror-tile', {
      init: function () {
        this.el.addEventListener('materialtextureloaded', () => {
          var map = this.el.getObject3D('mesh').material.map;
          map.wrapS = map.wrapT = AFRAME.THREE.MirroredRepeatWrapping;
          map.needsUpdate = true;
        });
      }
    });

    // ---------------------------------------------------------------------
    // copito: builds Copito's look (this step) and will own his idle
    // animation and hit state (next steps).
    //
    // The body is a CC-BY glTF model (see ASSETS.md for the required
    // credit), not hand-built primitives. One consequence worth knowing:
    // it's a single fused mesh (no separate "eye" or "crown" parts to
    // address individually), so later steps implement per-hit reactions
    // (wobble, flash, cracks, etc.) as whole-model transforms and overlay
    // effects instead of animating individual sub-parts.
    // ---------------------------------------------------------------------
    AFRAME.registerComponent('copito', {
      init: function () {
        var el = this.el;

        // Soft round blob shadow so Copito doesn't look like he's floating.
        // A-Frame has no built-in radial-gradient material, so we paint one
        // on a small canvas once and use it as the plane's texture.
        var shadowImg = this.makeBlobShadowTexture();
        el.sceneEl.querySelector('a-assets').appendChild(shadowImg);
        var shadow = document.createElement('a-plane');
        shadow.setAttribute('rotation', '-90 0 0');
        shadow.setAttribute('position', '0 0.005 0');
        shadow.setAttribute('width', '1.3');
        shadow.setAttribute('height', '1.3');
        shadow.setAttribute('material', 'src: #blobShadow; transparent: true; shader: flat');
        el.appendChild(shadow);

        // The model's own export has a messy internal transform (Sketchfab's
        // auto-converted FBX hierarchy: odd scale, off-center pivot). Rather
        // than fight that, we load it into a wrapper entity and correct it
        // with one scale + one position offset, both tunable from CONFIG.
        this.model = document.createElement('a-entity');
        this.model.setAttribute('gltf-model', '#copitoModel');
        this.model.setAttribute('scale', CONFIG.copitoScale + ' ' + CONFIG.copitoScale + ' ' + CONFIG.copitoScale);
        this.model.setAttribute('position', CONFIG.copitoOffset);
        el.appendChild(this.model);
      },

      // Paints a soft radial gradient (dark center, transparent edge) once
      // and returns it as an <img> ready to drop into <a-assets>.
      makeBlobShadowTexture: function () {
        var canvas = document.createElement('canvas');
        canvas.width = 128;
        canvas.height = 128;
        var ctx = canvas.getContext('2d');
        var gradient = ctx.createRadialGradient(64, 64, 0, 64, 64, 64);
        gradient.addColorStop(0, 'rgba(10,40,40,0.35)');
        gradient.addColorStop(1, 'rgba(10,40,40,0)');
        ctx.fillStyle = gradient;
        ctx.fillRect(0, 0, 128, 128);

        var img = document.createElement('img');
        img.id = 'blobShadow';
        img.src = canvas.toDataURL();
        return img;
      }
    });
  </script>
</body>
</html>
