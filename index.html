<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Copito: snowball demo</title>
  <script src="vendor/aframe.min.js"></script>
  <style>
    /* Required CC-BY credit for the snowman model (see ASSETS.md). Only
       visible on the 2D page (not inside the headset view) -- a matching
       in-scene credit line is added with the HUD in a later step so it's
       visible in VR too. */
    #credit {
      position: fixed; bottom: 6px; left: 8px; z-index: 9999;
      font: 11px sans-serif; color: #fff; text-shadow: 0 1px 2px #000;
      opacity: 0.8; max-width: 90vw;
    }
  </style>
</head>
<body>
  <div id="credit">
    "Snowman" by <a href="https://sketchfab.com/alixor22" style="color:inherit">alixor22</a>,
    licensed <a href="http://creativecommons.org/licenses/by/4.0/" style="color:inherit">CC-BY-4.0</a>
  </div>
  <a-scene renderer="antialias: true; colorManagement: true; foveationLevel: 1"
           fog="type: linear; color: #aab0b8; near: 4.5; far: 7.9"
           snowball-thrower>
    <!--
      antialias: smooths jagged edges, cheap enough on Quest 2 at this triangle budget.
      colorManagement: keeps colors consistent between the sRGB textures (sky photo) and
      the flat material colors (Copito), otherwise one of the two looks washed out.
      foveationLevel: 1: renders the edge of the lens view at lower resolution (you can't
      resolve it there anyway), a free performance win on the Quest 2 GPU.
      fog: fades the ground plane to the horizon color before its edge (at 8m, plane is
      16x16) is ever reached, so you never see the flat plane's square boundary. Starts
      past Copito (5m away) so he stays crisp and only the ground fades. a-sky ignores
      fog (see material="fog:false" below), so the photo background stays untouched.
    -->

    <a-assets>
      <img id="sky" src="assets/sky/sky.jpg">
      <img id="groundTex" src="assets/sky/ground.jpg">
      <a-asset-item id="copitoModel" src="assets/models/copito/scene.gltf"></a-asset-item>
    </a-assets>

    <!-- Units: meters. Y is up. Negative Z is in front of you. Rotated so the
         tree line sits behind Copito instead of the sun (avoids glare right
         where the player is aiming). material="fog:false" because A-Frame's
         material component defaults fog to ON for every mesh, including the
         sky sphere -- without this override, the whole photo gets blended
         away to the fog color since the sky sphere is effectively very far
         from the camera. -->
    <a-sky src="#sky" rotation="0 120 0" material="fog: false"></a-sky>

    <!-- Ground is a tile cropped from the sky photo's own foreground snow
         (not a flat color) repeated across the circle, so it carries the
         same texture detail (footprints, snow grain) as the photo instead
         of reading as a flat disc. Fog (below) fades it to the photo's
         horizon tone before its edge is reached, hiding the boundary.
         Circular, not square: fog fades by straight-line distance from the
         camera (radially symmetric), so a circle's edge is equidistant all
         the way around and hides exactly as evenly as the fog math expects,
         where a square's corners would sit farther out than its edges. -->
    <!-- shader:flat (unlit) to match <a-sky>'s own shader -- the standard
         (lit) shader multiplies the texture by the scene lights, which are
         tuned much dimmer than the sun exposure already baked into the
         photo, so the ground rendered darker than the sky and the fogged
         edge (matched to the photo's own color) didn't line up smoothly
         with the lit near-ground. Flat removes that mismatch entirely. -->
    <!-- radius is bigger than where the fog fade finishes (far: 7.9, just
         below) on purpose: that leaves a wide ring that's already 100%
         solid fog color before the actual mesh edge, instead of the mesh
         edge itself being the fade's last pixel. The raw join against the
         sky photo's own ground (which has its own color variation we can't
         perfectly match everywhere) happens far out in that solid margin
         instead of right where you'd notice it. -->
    <a-circle rotation="-90 0 0" radius="9.5" mirror-tile
              material="src: #groundTex; repeat: 6 6; shader: flat"></a-circle>

    <!-- Two simple lights instead of a custom rim-light shader (see plan
         notes): a cool hemisphere for ambient sky/ground bounce, one warm
         directional for the sun. Cheap and enough for the PBR model below. -->
    <a-entity light="type: hemisphere; color: #CFEFFF; groundColor: #9aa5ad; intensity: 0.9"></a-entity>
    <a-entity light="type: directional; color: #FFF1D6; intensity: 0.7" position="2 4 1"></a-entity>

    <a-entity id="copito" copito position="0 0 -5"></a-entity>

    <!-- Step 3: hand controllers for Quest, snowball pool + ballistic throw,
         and a per-source dotted aim arc. meta-touch-controls is the current
         A-Frame 1.7.0 component name for Quest Touch controllers (confirmed
         by grepping vendor/aframe.min.js -- oculus-touch-controls also
         exists as an older alias, same implementation). No laser-controls
         anywhere: see hide-controller-line below for why that alone isn't
         enough to keep the beam off. -->
    <a-entity id="leftHand" meta-touch-controls="hand: left" hide-controller-line
              trajectory-preview="source: hand"></a-entity>
    <a-entity id="rightHand" meta-touch-controls="hand: right" hide-controller-line
              trajectory-preview="source: hand"></a-entity>

    <a-entity camera position="0 1.6 0" look-controls wasd-controls
              trajectory-preview="source: desktop"></a-entity>
  </a-scene>

  <script>
    // ---------------------------------------------------------------------
    // CONFIG: every tunable number in one place. Change these, reload, done.
    // Units: meters, seconds, m/s.
    // ---------------------------------------------------------------------
    var CONFIG = {
      // Snowman placement and size
      snowmanDistance: -5,      // meters in front of the player
      snowmanHeight: 1.6,       // approx total height, for reference when tuning parts
      // The downloaded model's own export has an odd internal transform
      // (off-center pivot, arbitrary scale) baked in by its Sketchfab/FBX
      // export. These two numbers were measured once (its raw bounding box,
      // read via THREE.Box3 in the browser) and solved so the model ends up
      // centered and standing on the ground at CONFIG.snowmanHeight tall.
      copitoScale: 0.6324,
      copitoOffset: '-4.206 0.0574 3.6008',

      // Idle animation (step 2): bob + sway are added on top of
      // copitoOffset as deltas on the model wrapper, not the declarative
      // `animation` component, so later steps (hit-wobble, respawn pop) can
      // drive the same transform without fighting over it. Periods are
      // deliberately different (not a shared multiple) so the motion reads
      // as organic drift rather than a mechanical loop.
      idleBobAmplitude: 0.02,   // meters, vertical
      idleBobPeriod: 2.5,       // seconds per full cycle
      idleSwayAmplitude: 0.035, // radians (~2deg), side-to-side tilt
      idleSwayPeriod: 3.2,      // seconds per full cycle

      // Throwing (step 3)
      throwSpeed: 9,
      throwUpBias: 0.15,
      gravity: 9.8,
      throwCooldown: 0.25,
      maxSnowballs: 12,
      snowballLifetime: 3,
      snowballRadius: 0.08,
      // "Hit" is a proximity check against Copito's position, not real
      // collision geometry (step 3's event contract note: the model is one
      // fused mesh, so there are no separate part hitboxes). Generous on
      // purpose so aiming slightly off still reads as a hit.
      snowballHitRadius: 0.5,
      showTrajectory: true,
      trajectoryDots: 12,
      trajectoryDotInterval: 0.08, // seconds of flight time between dots

      // Hits and explosion (steps 4-5)
      hitsToExplode: 3,
      chunkCount: 50,
      chunkSpeedMin: 2,
      chunkSpeedMax: 5,
      respawnDelay: 2.5,
      idleSparkleCount: 120,
      explosionSparkleCount: 250,

      // Sound volumes 0 to 1 (step 6)
      volume: {
        throw: 0.5,
        hit: 0.6,
        crack: 0.6,
        explosion: 0.8,
        respawn: 0.6,
        ambience: 0.25
      },

      // Haptic pulses: [intensity 0 to 1, duration ms] (step 6)
      haptics: {
        throw: [0.3, 40],
        hit: [0.6, 80],
        explosion: [1.0, 150]
      },

      // Copito's palette, so the whole look can be re-tinted from one place
      colors: {
        snowBase: '#CFF5EA',
        snowLight: '#E2FBF4',
        tealDark: '#0B3D3A',
        tealMid: '#17A2A0',
        teal: '#14B8A6',
        tealStripe: '#0F766E',
        iceNose: '#2EC4B6',
        crownCyan: '#7DF9FF',
        sparkle: '#B8FFF4',
        snowball: '#F4FFFD'
      }
    };

    // ---------------------------------------------------------------------
    // I18N: every piece of visible text, Spanish first (default language).
    // ---------------------------------------------------------------------
    var I18N = {
      es: {
        instructionVR: '¡Apunta y aprieta el gatillo para lanzar bolas de nieve!',
        instructionDesktop: 'Haz clic para lanzar',
        hits: 'Golpes',
        destroyed: 'Muñecos destruidos'
      },
      en: {
        instructionVR: 'Aim and pull the trigger to throw snowballs!',
        instructionDesktop: 'Click to throw',
        hits: 'Hits',
        destroyed: 'Snowmen destroyed'
      }
    };

    // ---------------------------------------------------------------------
    // DesktopAim: live mouse position in normalized device coordinates
    // (-1 to 1), shared by snowball-thrower (desktop throw direction) and
    // trajectory-preview (desktop arc). A plain object with one listener,
    // not a component, since nothing here is tied to a specific entity.
    // ---------------------------------------------------------------------
    var DesktopAim = { x: 0, y: 0 };
    window.addEventListener('mousemove', function (evt) {
      DesktopAim.x = (evt.clientX / window.innerWidth) * 2 - 1;
      DesktopAim.y = -(evt.clientY / window.innerHeight) * 2 + 1;
    });

    // ---------------------------------------------------------------------
    // hide-controller-line: meta-touch-controls (like every vendor
    // touch-controls component) auto-attaches its own raycaster with
    // showLine:true as soon as a controller connects -- confirmed by
    // grepping vendor/aframe.min.js (its internal per-vendor mapping merges
    // `{showLine: true}` as the default), not assumed from memory, per the
    // step 1 lesson. The dotted trajectory arc is the only aim visual this
    // demo wants (it shows the real gravity drop, a straight laser doesn't,
    // and the original spec's own note says to keep hello_quest's laser
    // hidden since it fights with the arc), so this flips the
    // auto-added line back off every time the library turns it on.
    // ---------------------------------------------------------------------
    AFRAME.registerComponent('hide-controller-line', {
      init: function () {
        var hide = () => this.el.setAttribute('raycaster', 'showLine', false);
        this.el.addEventListener('controllerconnected', hide);
        this.el.addEventListener('controllermodelready', hide);
      }
    });

    // ---------------------------------------------------------------------
    // snowball-thrower: lives on <a-scene>. Owns the pooled snowball
    // entities, listens for throw input from both hands and the desktop
    // mouse, and runs the shared ballistic tick for every live snowball.
    // One pool, pre-created once and reused by round-robin index, per the
    // no-create/destroy-per-throw budget.
    // ---------------------------------------------------------------------
    AFRAME.registerComponent('snowball-thrower', {
      init: function () {
        var THREE = AFRAME.THREE;
        this.lastTickTime = 0;
        this.cooldownUntil = {}; // per source key ('left'/'right'/'desktop')
        this.scratchOrigin = new THREE.Vector3();
        this.scratchDir = new THREE.Vector3();
        this.scratchCopitoPos = new THREE.Vector3();
        this.raycaster = new THREE.Raycaster();

        this.buildPool();

        this.copito = this.el.querySelector('#copito');
        this.leftHand = this.el.querySelector('#leftHand');
        this.rightHand = this.el.querySelector('#rightHand');

        this.leftHand.addEventListener('triggerdown', () => this.throwFromHand(this.leftHand, 'left'));
        this.rightHand.addEventListener('triggerdown', () => this.throwFromHand(this.rightHand, 'right'));

        // this.el.canvas only exists once the scene has finished loading.
        if (this.el.hasLoaded) {
          this.attachDesktopInput();
        } else {
          this.el.addEventListener('loaded', () => this.attachDesktopInput());
        }
      },

      attachDesktopInput: function () {
        this.el.canvas.addEventListener('mousedown', () => this.throwFromDesktop());
      },

      buildPool: function () {
        var THREE = AFRAME.THREE;
        this.pool = [];
        this.nextIndex = 0;
        for (var i = 0; i < CONFIG.maxSnowballs; i++) {
          var el = document.createElement('a-sphere');
          el.setAttribute('radius', CONFIG.snowballRadius);
          el.setAttribute('segments-width', 8);
          el.setAttribute('segments-height', 8);
          el.setAttribute('material', 'color: ' + CONFIG.colors.snowball + '; roughness: 0.6; metalness: 0');
          el.setAttribute('visible', false);
          this.el.appendChild(el);
          this.pool.push({ el: el, active: false, velocity: new THREE.Vector3(), spawnTime: 0 });
        }
      },

      throwFromHand: function (handEl, sourceKey) {
        if (!this.canThrow(sourceKey)) return;
        handEl.object3D.getWorldPosition(this.scratchOrigin);
        handEl.object3D.getWorldDirection(this.scratchDir);
        this.spawn(this.scratchOrigin, this.scratchDir);
        this.pulseHaptics(handEl, CONFIG.haptics.throw[0], CONFIG.haptics.throw[1]);
      },

      throwFromDesktop: function () {
        if (!this.canThrow('desktop')) return;
        var camera = this.el.camera;
        if (!camera) return;
        this.raycaster.setFromCamera({ x: DesktopAim.x, y: DesktopAim.y }, camera);
        this.spawn(this.raycaster.ray.origin, this.raycaster.ray.direction);
      },

      canThrow: function (sourceKey) {
        var now = this.lastTickTime;
        if (this.cooldownUntil[sourceKey] !== undefined && now < this.cooldownUntil[sourceKey]) return false;
        this.cooldownUntil[sourceKey] = now + CONFIG.throwCooldown * 1000;
        return true;
      },

      spawn: function (origin, direction) {
        var sb = this.pool[this.nextIndex];
        this.nextIndex = (this.nextIndex + 1) % this.pool.length;

        sb.active = true;
        sb.spawnTime = this.lastTickTime;
        sb.el.object3D.position.copy(origin);
        sb.el.object3D.visible = true;

        sb.velocity.copy(direction).normalize().multiplyScalar(CONFIG.throwSpeed);
        sb.velocity.y += CONFIG.throwUpBias;
      },

      deactivate: function (sb) {
        sb.active = false;
        sb.el.object3D.visible = false;
      },

      pulseHaptics: function (handEl, intensity, durationMs) {
        var tracked = handEl.components['tracked-controls'];
        var gamepad = tracked && tracked.controller && tracked.controller.gamepad;
        var actuator = gamepad && gamepad.hapticActuators && gamepad.hapticActuators[0];
        if (actuator) actuator.pulse(intensity, durationMs);
      },

      // Ballistic update for every live snowball (Euler integration, scratch
      // vectors reused, no per-frame allocation) + the proximity "hit"
      // check against Copito that hands off to step 4 via the
      // `snowball-hit` DOM event (step 4 just adds the listener).
      tick: function (time, delta) {
        this.lastTickTime = time;
        var dt = Math.min(delta / 1000, 0.05);

        this.copito.object3D.getWorldPosition(this.scratchCopitoPos);

        for (var i = 0; i < this.pool.length; i++) {
          var sb = this.pool[i];
          if (!sb.active) continue;

          sb.velocity.y -= CONFIG.gravity * dt;
          sb.el.object3D.position.addScaledVector(sb.velocity, dt);

          var pos = sb.el.object3D.position;
          if (pos.distanceTo(this.scratchCopitoPos) <= CONFIG.snowballHitRadius) {
            this.copito.emit('snowball-hit', { point: { x: pos.x, y: pos.y, z: pos.z } });
            this.deactivate(sb);
            continue;
          }

          if ((time - sb.spawnTime) / 1000 > CONFIG.snowballLifetime) {
            this.deactivate(sb);
          }
        }
      }
    });

    // ---------------------------------------------------------------------
    // circleSpriteTexture: a small soft-edged white circle, painted once on
    // a canvas and shared by every trajectory-preview instance. WebGL point
    // sprites render as plain squares unless given a `map` texture (with
    // alphaTest to cut out the corners) -- this is that texture, round
    // instead of square.
    // ---------------------------------------------------------------------
    var circleSpriteTexture = null;
    function getCircleSpriteTexture() {
      if (circleSpriteTexture) return circleSpriteTexture;
      var canvas = document.createElement('canvas');
      canvas.width = canvas.height = 64;
      var ctx = canvas.getContext('2d');
      var gradient = ctx.createRadialGradient(32, 32, 0, 32, 32, 30);
      gradient.addColorStop(0, 'rgba(255,255,255,1)');
      gradient.addColorStop(0.7, 'rgba(255,255,255,0.9)');
      gradient.addColorStop(1, 'rgba(255,255,255,0)');
      ctx.fillStyle = gradient;
      ctx.fillRect(0, 0, 64, 64);
      circleSpriteTexture = new AFRAME.THREE.CanvasTexture(canvas);
      return circleSpriteTexture;
    }

    // ---------------------------------------------------------------------
    // trajectory-preview: one dotted arc per aim source (each hand entity,
    // plus one on the camera for desktop). Dot positions come from the same
    // ballistic formula snowball-thrower uses, so the preview actually
    // matches where a thrown snowball will go. Hidden while that source's
    // trigger/mouse button is held down.
    // ---------------------------------------------------------------------
    AFRAME.registerComponent('trajectory-preview', {
      schema: { source: { default: 'hand' } }, // 'hand' or 'desktop'

      init: function () {
        var THREE = AFRAME.THREE;
        this.held = false;
        this.scratchOrigin = new THREE.Vector3();
        this.scratchDir = new THREE.Vector3();
        this.raycaster = new THREE.Raycaster();

        var n = CONFIG.trajectoryDots;
        var geometry = new THREE.BufferGeometry();
        geometry.setAttribute('position', new THREE.BufferAttribute(new Float32Array(n * 3), 3));

        this.points = new THREE.Points(geometry, new THREE.PointsMaterial({
          color: new THREE.Color(CONFIG.colors.snowball),
          size: 0.055,
          sizeAttenuation: true,
          map: getCircleSpriteTexture(),
          alphaTest: 0.1, // discards the texture's transparent corners instead of just blending them, so depthWrite can stay accurate
          transparent: true,
          opacity: 0.9,
          depthWrite: false
        }));
        // A thin line through the same dots so the arc reads as one curve,
        // not a scatter of separate points. Shares the Points' geometry
        // (same position attribute, one update moves both) rather than
        // duplicating the buffer.
        this.line = new THREE.Line(geometry, new THREE.LineBasicMaterial({
          color: new THREE.Color(CONFIG.colors.snowball),
          transparent: true,
          opacity: 0.35,
          depthWrite: false
        }));
        // World-space points/line: positions below are computed in world
        // space directly, so these attach to the scene root rather than
        // `el`, independent of the aim source's own transform.
        this.el.sceneEl.object3D.add(this.points);
        this.el.sceneEl.object3D.add(this.line);

        if (this.data.source === 'hand') {
          this.el.addEventListener('triggerdown', () => { this.held = true; });
          this.el.addEventListener('triggerup', () => { this.held = false; });
        } else {
          var attach = () => {
            this.el.sceneEl.canvas.addEventListener('mousedown', () => { this.held = true; });
            this.el.sceneEl.canvas.addEventListener('mouseup', () => { this.held = false; });
          };
          if (this.el.sceneEl.hasLoaded) attach();
          else this.el.sceneEl.addEventListener('loaded', attach);
        }
      },

      tick: function () {
        var hideForVR = this.data.source === 'desktop' && this.el.sceneEl.is('vr-mode');
        if (!CONFIG.showTrajectory || this.held || hideForVR) {
          this.setVisible(false);
          return;
        }

        if (this.data.source === 'hand') {
          this.el.object3D.getWorldPosition(this.scratchOrigin);
          this.el.object3D.getWorldDirection(this.scratchDir);
        } else {
          var camera = this.el.sceneEl.camera;
          if (!camera) { this.setVisible(false); return; }
          this.raycaster.setFromCamera({ x: DesktopAim.x, y: DesktopAim.y }, camera);
          this.scratchOrigin.copy(this.raycaster.ray.origin);
          this.scratchDir.copy(this.raycaster.ray.direction);
        }

        this.setVisible(true);
        this.updateDots();
      },

      setVisible: function (visible) {
        this.points.visible = visible;
        this.line.visible = visible;
      },

      updateDots: function () {
        var positions = this.points.geometry.attributes.position.array;
        var vx = this.scratchDir.x * CONFIG.throwSpeed;
        var vy = this.scratchDir.y * CONFIG.throwSpeed + CONFIG.throwUpBias;
        var vz = this.scratchDir.z * CONFIG.throwSpeed;

        for (var i = 0; i < CONFIG.trajectoryDots; i++) {
          var t = (i + 1) * CONFIG.trajectoryDotInterval;
          positions[i * 3] = this.scratchOrigin.x + vx * t;
          positions[i * 3 + 1] = this.scratchOrigin.y + vy * t - 0.5 * CONFIG.gravity * t * t;
          positions[i * 3 + 2] = this.scratchOrigin.z + vz * t;
        }

        this.points.geometry.attributes.position.needsUpdate = true;
      }
    });

    // ---------------------------------------------------------------------
    // mirror-tile: makes a repeated ground texture seamless. A-Frame's
    // `repeat` attribute tiles the texture, but plain repeating shows a
    // visible seam every tile (the crop's edges don't match up). Mirroring
    // every other tile fixes that for free, since a flipped copy of an
    // image always lines up with itself at the seam -- no special texture
    // needed. Not exposed as a plain HTML attribute, so it's a few lines
    // of three.js instead.
    // ---------------------------------------------------------------------
    AFRAME.registerComponent('mirror-tile', {
      init: function () {
        this.el.addEventListener('materialtextureloaded', () => {
          var map = this.el.getObject3D('mesh').material.map;
          map.wrapS = map.wrapT = AFRAME.THREE.MirroredRepeatWrapping;
          map.needsUpdate = true;
        });
      }
    });

    // ---------------------------------------------------------------------
    // copito: builds Copito's look (this step) and will own his idle
    // animation and hit state (next steps).
    //
    // The body is a CC-BY glTF model (see ASSETS.md for the required
    // credit), not hand-built primitives. One consequence worth knowing:
    // it's a single fused mesh (no separate "eye" or "crown" parts to
    // address individually), so later steps implement per-hit reactions
    // (wobble, flash, cracks, etc.) as whole-model transforms and overlay
    // effects instead of animating individual sub-parts.
    // ---------------------------------------------------------------------
    AFRAME.registerComponent('copito', {
      init: function () {
        var el = this.el;

        // Soft round blob shadow so Copito doesn't look like he's floating.
        // A-Frame has no built-in radial-gradient material, so we paint one
        // on a small canvas once and use it as the plane's texture.
        var shadowImg = this.makeBlobShadowTexture();
        el.sceneEl.querySelector('a-assets').appendChild(shadowImg);
        var shadow = document.createElement('a-plane');
        shadow.setAttribute('rotation', '-90 0 0');
        shadow.setAttribute('position', '0 0.005 0');
        shadow.setAttribute('width', '1.3');
        shadow.setAttribute('height', '1.3');
        shadow.setAttribute('material', 'src: #blobShadow; transparent: true; shader: flat');
        el.appendChild(shadow);

        // The model's own export has a messy internal transform (Sketchfab's
        // auto-converted FBX hierarchy: odd scale, off-center pivot). Rather
        // than fight that, we load it into a wrapper entity and correct it
        // with one scale + one position offset, both tunable from CONFIG.
        this.model = document.createElement('a-entity');
        this.model.setAttribute('gltf-model', '#copitoModel');
        this.model.setAttribute('scale', CONFIG.copitoScale + ' ' + CONFIG.copitoScale + ' ' + CONFIG.copitoScale);
        this.model.setAttribute('position', CONFIG.copitoOffset);
        el.appendChild(this.model);

        // Base position for the idle bob/sway below -- read from CONFIG
        // directly rather than back from the DOM attribute, since the
        // entity's object3D isn't guaranteed to have applied it yet this
        // same tick.
        var offset = CONFIG.copitoOffset.split(' ').map(Number);
        this.modelBasePosition = { x: offset[0], y: offset[1], z: offset[2] };

        this.buildSparkles();
      },

      // Idle bob (vertical sine) + slight sway (side-to-side tilt), applied
      // as deltas on top of the model's corrective offset position. Blink
      // is intentionally skipped: the model is a single fused mesh with no
      // separable eyes (see PROGRESS.md step 2), and the bob/sway/sparkles
      // combo already reads as alive without it.
      tick: function (time) {
        var t = time / 1000;
        var bob = Math.sin((t / CONFIG.idleBobPeriod) * Math.PI * 2) * CONFIG.idleBobAmplitude;
        var sway = Math.sin((t / CONFIG.idleSwayPeriod) * Math.PI * 2) * CONFIG.idleSwayAmplitude;

        this.model.object3D.position.set(
          this.modelBasePosition.x,
          this.modelBasePosition.y + bob,
          this.modelBasePosition.z
        );
        this.model.object3D.rotation.z = sway;

        this.updateSparkles(t);
      },

      // ~120 orbiting points around Copito's body, one THREE.Points buffer
      // (not N entities) to keep the draw-call budget flat. Attached to the
      // outer entity's object3D (ground level under Copito), independent of
      // the model wrapper's bob/sway above.
      buildSparkles: function () {
        var n = CONFIG.idleSparkleCount;
        var THREE = AFRAME.THREE;
        var positions = new Float32Array(n * 3);

        this.sparkleAngles = new Float32Array(n);
        this.sparkleSpeeds = new Float32Array(n);
        this.sparkleRadii = new Float32Array(n);
        this.sparkleHeights = new Float32Array(n);
        this.sparklePhases = new Float32Array(n);

        for (var i = 0; i < n; i++) {
          this.sparkleAngles[i] = Math.random() * Math.PI * 2;
          this.sparkleSpeeds[i] = 0.15 + Math.random() * 0.25;
          this.sparkleRadii[i] = 0.55 + Math.random() * 0.45;
          this.sparkleHeights[i] = 0.15 + Math.random() * 1.3;
          this.sparklePhases[i] = Math.random() * Math.PI * 2;
        }

        var geometry = new THREE.BufferGeometry();
        geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));

        var material = new THREE.PointsMaterial({
          color: new THREE.Color(CONFIG.colors.sparkle),
          size: 0.035,
          sizeAttenuation: true,
          transparent: true,
          opacity: 0.85,
          depthWrite: false,
          blending: THREE.AdditiveBlending
        });

        this.sparkles = new THREE.Points(geometry, material);
        this.el.object3D.add(this.sparkles);
        this.updateSparkles(0);
      },

      updateSparkles: function (t) {
        var n = CONFIG.idleSparkleCount;
        var positions = this.sparkles.geometry.attributes.position.array;

        for (var i = 0; i < n; i++) {
          var angle = this.sparkleAngles[i] + t * this.sparkleSpeeds[i];
          var radius = this.sparkleRadii[i];
          var bobOffset = Math.sin(t * 1.5 + this.sparklePhases[i]) * 0.08;

          positions[i * 3] = Math.cos(angle) * radius;
          positions[i * 3 + 1] = this.sparkleHeights[i] + bobOffset;
          positions[i * 3 + 2] = Math.sin(angle) * radius;
        }

        this.sparkles.geometry.attributes.position.needsUpdate = true;
      },

      // Paints a soft radial gradient (dark center, transparent edge) once
      // and returns it as an <img> ready to drop into <a-assets>.
      makeBlobShadowTexture: function () {
        var canvas = document.createElement('canvas');
        canvas.width = 128;
        canvas.height = 128;
        var ctx = canvas.getContext('2d');
        var gradient = ctx.createRadialGradient(64, 64, 0, 64, 64, 64);
        gradient.addColorStop(0, 'rgba(10,40,40,0.35)');
        gradient.addColorStop(1, 'rgba(10,40,40,0)');
        ctx.fillStyle = gradient;
        ctx.fillRect(0, 0, 128, 128);

        var img = document.createElement('img');
        img.id = 'blobShadow';
        img.src = canvas.toDataURL();
        return img;
      }
    });
  </script>
</body>
</html>
